# Tiny configuration for installation checks and reproducibility tests. A deliberately short sampler:
# fits are NOT expected to pass the diagnostics, and results are not scientific output.
study_id: smoke
base_seed: 20261009

item_generator:
  kind: koenig2022
  alpha_location: 1.0
  beta_location: 0.0
  aux_lower: [0.65, -4.5]
  aux_upper: [4.0, 4.5]
  accept_alpha: [0.45, 4.0]
  accept_beta: [-4.5, 4.5]
  center: truncated_mean
  max_tries: 100000

worlds:
  typical: {tau_alpha: 0.25, tau_beta: 0.90}

populations:
  S0: {difficulty_shift: 0.0, theta: {kind: normal}}
  S1: {difficulty_shift: -1.5, theta: {kind: normal}}
  S2: {difficulty_shift: -1.5, theta: {kind: skewnormal_standardized, shape: -4.0}}

blocks:
  - {name: S0, population: S0, worlds: [typical], N: [50], test_length: [10], rho: [0.3], replications: 1}
  - {name: S1, population: S1, worlds: [typical], N: [50], test_length: [10], rho: [0.3], replications: 1}
  - {name: S2, population: S2, worlds: [typical], N: [50], test_length: [10], rho: [0.3], replications: 1}

estimator:
  kind: hierarchical_2pl_centered_b
  priors: {mu_log_a_mean: 0.0, mu_log_a_sd: 0.5, sigma_log_a_scale: 0.5,
           mu_b_mean: 0.0, mu_b_sd: 1.0, sigma_b_scale: 1.0}
  sampler: {chains: 2, tune: 200, draws: 200, target_accept: 0.95, interval: 0.95}

diagnostics: {rhat_max: 1.01, ess_bulk_min: 400, ess_tail_min: 400, max_divergences: 0, gross_rhat: 1.1}

reporting:
  item_error_tolerances: [0.2]
  envelopes:
    - {name: main, populations: [S0, S1], worlds: [typical]}

execution:
  chain_cores: 2
  threads_per_process: 1
