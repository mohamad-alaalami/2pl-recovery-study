name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Runner, compiler and PyTensor backend
        run: |
          nproc
          free -m
          g++ --version | head -1
          python -c "from recovery2pl import toolchain; toolchain.configure(); print('pytensor backend:', toolchain.require_c_backend())"

      - name: Fast tests
        run: python -W ignore::FutureWarning -m unittest discover -s tests -v

      - name: Tiny real fit, twice (reproducibility)
        env:
          RECOVERY2PL_SLOW: "1"
        run: python -W ignore::FutureWarning -m unittest tests.test_integration_fit -v
